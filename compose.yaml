services:
  my-media-aigent:
    image: registry.homelab/homelab/my-media-aigent:latest
    environment:
      - TZ=America/Halifax
      - OVERSEERR_URL=http://seerr:5055
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    secrets:
      - telegram_bot_token
      - overseerr_api_key
    networks:
      - mouseion_private

networks:
  mouseion_private:
    external: true
    name: mouseion_private

secrets:
  telegram_bot_token:
    external: true
  overseerr_api_key:
    external: true
